<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Zavyn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand-link" aria-label="Voltar para a Zavyn">
      <img src="zavyn-logo.png" alt="Zavyn" class="site-logo">
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Criar conta</h1>
      <p class="auth-intro">Crie seu perfil na Zavyn.</p>

      <form class="auth-form" id="signupForm">
        <label for="signupName">Nome</label>
        <input id="signupName" name="name" type="text" autocomplete="name" maxlength="80" required>

        <label for="signupUsername">@Usuário</label>
        <input id="signupUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="20" placeholder="ex.: mateus_01" required>
        <small class="field-help">Use apenas letras, números e _.</small>

        <label for="signupEmail">E-mail</label>
        <input id="signupEmail" name="email" type="email" autocomplete="email" required>

        <label for="signupPassword">Senha</label>
        <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <small class="field-help">Mínimo de 8 caracteres.</small>

        <button type="submit" class="primary-btn">CRIAR CONTA</button>
      </form>

      <p id="signupMessage" class="auth-message" aria-live="polite"></p>
      <p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-support" href="mailto:Zavynsuporte@gmail.com">Suporte: Zavynsuporte@gmail.com</a>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
