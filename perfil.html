<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Zavyn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand-link" aria-label="Voltar para a Zavyn">
      <img src="zavyn-logo.png" alt="Zavyn" class="site-logo">
    </a>
  </header>

  <main class="profile-page">
    <section class="profile-card">
      <div class="profile-avatar" aria-hidden="true">Z</div>
      <div class="profile-info">
        <h1>Seu perfil</h1>
        <p class="profile-handle">@usuario</p>
        <p class="profile-bio">Sua biografia aparecerá aqui.</p>
      </div>
    </section>

    <section class="profile-section">
      <div class="section-heading">
        <h2>Mural</h2>
        <span>Até 3 fotos</span>
      </div>
      <div class="profile-mural">
        <div class="mural-slot">+</div>
        <div class="mural-slot">+</div>
        <div class="mural-slot">+</div>
      </div>
    </section>

    <section class="profile-stats" aria-label="Informações do perfil">
      <div><strong>0</strong><span>Livros publicados</span></div>
      <div><strong>0</strong><span>Seguidores</span></div>
      <div><strong>0</strong><span>Seguindo</span></div>
      <div><strong>0</strong><span>Favoritos</span></div>
    </section>

    <section class="profile-section">
      <div class="section-heading">
        <h2>Livros publicados</h2>
      </div>
      <div class="empty-state">
        <p>Você ainda não publicou nenhum livro.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-support" href="mailto:Zavynsuporte@gmail.com">Suporte: Zavynsuporte@gmail.com</a>
  </footer>
</body>
</html>
