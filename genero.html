<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zavyn — Livros</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,11,13,.96);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      min-height: 72px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand img {
      max-width: 145px;
      max-height: 48px;
      display: block;
    }

    .brand-text-fallback {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .header-nav {
      display: flex;
      gap: 20px;
      font-size: .85rem;
      font-weight: 700;
    }

    .header-nav a {
      opacity: .8;
      transition: .2s;
    }

    .header-nav a:hover {
      opacity: 1;
      color: #d8b85a;
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 55px 20px 80px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #d8b85a;
      font-weight: 800;
    }

    .page-heading {
      margin-bottom: 35px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .page-heading h1 em {
      color: #d8b85a;
      font-style: normal;
    }

    .page-heading p {
      margin: 12px 0 0;
      color: #999;
      line-height: 1.6;
      max-width: 700px;
    }

    .ranking-box {
      margin-bottom: 35px;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid rgba(216,184,90,.18);
      background: linear-gradient(
        135deg,
        rgba(216,184,90,.08),
        rgba(255,255,255,.025)
      );
    }

    .ranking-box h2 {
      margin: 0 0 5px;
      font-size: 1.25rem;
    }

    .ranking-box p {
      margin: 0;
      color: #888;
      font-size: .88rem;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .book-card {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08);
      background: #121216;
      transition: transform .2s, border-color .2s;
    }

    .book-card:hover {
      transform: translateY(-4px);
      border-color: rgba(216,184,90,.35);
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #18181d;
    }

    .book-info {
      padding: 17px;
    }

    .book-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .book-author {
      margin: 7px 0 0;
      color: #999;
      font-size: .84rem;
    }

    .book-rating {
      margin-top: 13px;
      color: #d8b85a;
      font-size: .9rem;
    }

    .book-rating span {
      color: #888;
      margin-left: 5px;
    }

    .book-votes {
      margin-top: 6px;
      color: #888;
      font-size: .78rem;
    }

    .book-description {
      margin: 12px 0 0;
      color: #aaa;
      font-size: .82rem;
      line-height: 1.5;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .meta-tag {
      padding: 5px 8px;
      border-radius: 7px;
      background: rgba(255,255,255,.06);
      color: #999;
      font-size: .7rem;
    }

    .book-footer {
      margin-top: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .book-price {
      font-weight: 800;
      color: #fff;
    }

    .book-price.free {
      color: #d8b85a;
    }

    .buy-button {
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      background: #d8b85a;
      color: #111;
      font-size: .75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .buy-button:hover {
      filter: brightness(1.08);
    }

    .free-button {
      background: transparent;
      border: 1px solid rgba(216,184,90,.4);
      color: #d8b85a;
    }

    .empty-state,
    .error-state,
    .loading-state {
      padding: 45px 20px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 16px;
      color: #888;
    }

    .error-state {
      color: #d88;
    }

    footer {
      padding: 30px 20px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #777;
      font-size: .8rem;
    }

    @media (max-width: 950px) {
      .books-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .header-inner {
        min-height: 62px;
      }

      .header-nav {
        gap: 12px;
        font-size: .72rem;
      }

      main {
        padding: 38px 15px 60px;
      }

      .books-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .book-info {
        padding: 13px;
      }

      .book-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .buy-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <img
        src="logo.png"
        alt="Zavyn"
        onerror="
          this.style.display='none';
          this.parentElement.classList.add('brand-text-fallback');
          this.parentElement.textContent='ZAVYN';
        "
      >
    </a>

    <nav class="header-nav">
      <a href="index.html">LOJA</a>
      <a href="perfil.html">MEU PERFIL</a>
    </nav>

  </div>
</header>


<main>

  <section class="page-heading">

    <p class="eyebrow">CATÁLOGO ZAVYN</p>

    <h1>
      Livros de <em id="genreTitle">...</em>
    </h1>

    <p id="genreDescription">
      Descubra novas histórias e autores independentes.
    </p>

  </section>


  <section class="ranking-box">

    <h2>🏆 Ranking mensal</h2>

    <p>
      Os livros mais votados pelos leitores da Zavyn.
    </p>

  </section>


  <section>

    <div
      id="booksGrid"
      class="books-grid"
    >
      <div class="loading-state">
        Carregando livros...
      </div>
    </div>

  </section>

</main>


<footer>
  <p>Livros que levam você a novos mundos.</p>
  <p>© 2026 Zavyn. Todos os direitos reservados.</p>
</footer>


<script>

const ZAVYN_API =
  "https://zavyn-api.portalzero26.workers.dev";


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatPrice(value) {

  const price = Number(value || 0);

  if (price <= 0) {
    return "GRÁTIS";
  }

  return price.toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );

}


function renderStars() {

  return "★★★★★";

}


function getGenre() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("genre") ||
    "Fantasia"
  ).trim();

}


function renderBooks(books) {

  const grid =
    document.getElementById(
      "booksGrid"
    );

  if (!books.length) {

    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <strong>Nenhum livro encontrado.</strong>
        <p>
          Ainda não existem livros publicados neste gênero.
        </p>
      </div>
    `;

    return;
  }


  grid.innerHTML =
    books.map(book => {

      const paid =
        String(book.book_type || "paid")
          .toLowerCase() === "paid";

      const price =
        Number(book.price || 0);


      return `

        <article class="book-card">

          <img
            class="book-cover"
            src="${escapeHtml(book.cover_url)}"
            alt="Capa de ${escapeHtml(book.title)}"
            loading="lazy"
            onerror="
              this.style.opacity='.25';
            "
          >

          <div class="book-info">

            <h2 class="book-title">
              ${escapeHtml(book.title)}
            </h2>

            <p class="book-author">
              por
              <strong>
                ${escapeHtml(
                  book.author?.name || "Autor"
                )}
              </strong>
            </p>


            <div class="book-rating">

              ${renderStars()}

              <span>
                Em breve
              </span>

            </div>


            <div class="book-votes">
              🗳️ Ranking mensal: em breve
            </div>


            <p class="book-description">
              ${escapeHtml(
                book.description || ""
              )}
            </p>


            <div class="book-meta">

              ${
                book.age_rating
                  ? `
                    <span class="meta-tag">
                      ${escapeHtml(
                        book.age_rating
                      )}
                    </span>
                  `
                  : ""
              }

              ${
                book.genre
                  ? `
                    <span class="meta-tag">
                      ${escapeHtml(
                        book.genre
                      )}
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="book-footer">

              <strong
                class="book-price ${
                  !paid || price <= 0
                    ? "free"
                    : ""
                }"
              >
                ${formatPrice(price)}
              </strong>


              ${
                paid && price > 0
                  ? `
                    <button
                      class="buy-button"
                      type="button"
                      onclick="openBook('${escapeHtml(book.id)}')"
                    >
                      COMPRAR
                    </button>
                  `
                  : `
                    <button
                      class="buy-button free-button"
                      type="button"
                      onclick="openBook('${escapeHtml(book.id)}')"
                    >
                      VER LIVRO
                    </button>
                  `
              }

            </div>

          </div>

        </article>

      `;

    }).join("");

}


function openBook(bookId) {

  /*
    O botão já está preparado.

    A próxima etapa vai conectar
    este botão ao checkout do
    marketplace.

    Não alteramos o sistema
    antigo dos 8 volumes.
  */

  alert(
    "Página do livro preparada. O checkout do marketplace será conectado na próxima etapa."
  );

}


async function loadBooks() {

  const genre =
    getGenre();

  document.title =
    `Zavyn — ${genre}`;


  document.getElementById(
    "genreTitle"
  ).textContent = genre;


  const grid =
    document.getElementById(
      "booksGrid"
    );


  try {

    const response =
      await fetch(
        `${ZAVYN_API}/books?genre=${encodeURIComponent(genre)}&limit=50`
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Não foi possível carregar os livros."
      );

    }


    renderBooks(
      Array.isArray(data.books)
        ? data.books
        : []
    );


  } catch (error) {

    grid.innerHTML = `

      <div
        class="error-state"
        style="grid-column:1/-1;"
      >

        <strong>
          Erro ao carregar o catálogo.
        </strong>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


document.addEventListener(
  "DOMContentLoaded",
  loadBooks
);

</script>

</body>
</html>
